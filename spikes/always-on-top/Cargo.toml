[package]
name = "aot-spike"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
# macos-private-api is required for `transparent: true` on macOS.
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
