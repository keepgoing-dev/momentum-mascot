<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>aot-spike</title>
    <style>
      /* The dot reports its own configuration, because the terminal is not visible while
         another app owns the screen. Colour and digit both identify the active combo.
         The transparent corners around the circle are the transparency test: a square
         instead of a circle means `transparent: true` did not take effect. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        display: grid;
        place-items: center;
      }
      .dot {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border-radius: 50%;
        background: #ff00ff;
        border: 4px solid #000;
        display: grid;
        place-items: center;
        font: bold 28px/1 ui-monospace, monospace;
        color: #000;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="dot">1</div>
    <script>
      window.setCombo = (index, colour) => {
        const dot = document.querySelector(".dot");
        dot.style.background = colour;
        dot.textContent = String(index);
        // White and yellow need dark text; the rest read fine as black anyway.
        dot.style.color = "#000";
      };
    </script>
  </body>
</html>
