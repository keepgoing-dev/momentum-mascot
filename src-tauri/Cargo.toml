[package]
name = "momentum-mascot"
version = "0.3.1"
edition = "2021"
publish = false
description = "A retro pixel mascot that reflects side-project momentum"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for `transparent: true` on the pet window, and it makes the
# app ineligible for the Mac App Store. Accounted for in spec-v2.md section 10.3.
# image-png is what lets the share card cross from the webview's canvas to the clipboard as
# a real image rather than a data URL.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The pet's NSPanel conversion (section 10.3). objc2-app-kit is already in the tree via
# tauri's own macOS runtime, so the typed NSScreen access below costs nothing extra.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Core Animation, for the pet's sprite layer. Already in Cargo.lock at 0.3.2 as a transitive
# dependency of objc2-app-kit.
#
# `default-features = false` is load-bearing. Every class in this crate is behind its own feature
# and `default` turns on ALL of them, which drags in objc2-metal, objc2-core-video and
# objc2-core-graphics: three packages this app has no use for, one of them entirely new to the
# lock file. With defaults off and only these five named, the lock gains nothing but the
# dependency edge. `CAKeyframeAnimation` is not its own feature; it lives under `CAAnimation`.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "CALayer",
  "CAAnimation",
  "CAMediaTiming",
  "CATransform3D",
  # Only for the frame-count probe in `sprite::view`, which flushes a transaction so the
  # presentation layer can be read back deterministically.
  "CATransaction",
  # Not a class: this one gates every method whose signature mentions a Core Foundation
  # type, which is `setFrame`, `setContentsScale`, `setTransform`, `setDuration` and the whole
  # of `CATransform3D`. Without it those methods simply do not exist and the errors read as
  # missing methods rather than a missing feature. Already in the lock, so it adds nothing.
  "objc2-core-foundation",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
